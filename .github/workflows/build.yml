
name: Build Flin Mobile Launcher

on:
  workflow_dispatch:
  push:
    branches: ["**"]
    paths:
      - "FlinMobileLauncher/**"
      - ".github/workflows/build.yml"
  pull_request:
    paths:
      - "FlinMobileLauncher/**"
      - ".github/workflows/build.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle 8.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.2

      - name: Build debug APK
        working-directory: FlinMobileLauncher
        run: gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FlinMobileLauncher-debug
          path: FlinMobileLauncher/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
