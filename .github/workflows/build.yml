name: Android Debug Build

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          accept-android-sdk-licenses: true
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'

      - name: Set up Gradle 8.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.2'

      - name: Fix invalid Android resource filenames
        shell: bash
        run: |
          set -euo pipefail
          RES_DIR="app/src/main/res"

          if [[ ! -d "$RES_DIR" ]]; then
            echo "::error::Resource folder not found: $RES_DIR"
            exit 1
          fi

          if [[ -f "$RES_DIR/mipmap-hdpi/1" ]]; then
            rm -- "$RES_DIR/mipmap-hdpi/1"
            echo "Removed invalid extensionless resource: mipmap-hdpi/1"
          fi

          while IFS= read -r -d '' file; do
            dir="$(dirname "$file")"
            name="$(basename "$file")"

            if [[ "$name" != *.* ]]; then
              echo "::error file=$file::Resource file has no extension. Give it a valid extension or remove it if unnecessary."
              exit 1
            fi

            base="${name%.*}"
            ext="${name##*.}"
            normalized_base="$(printf '%s' "$base" | tr '[:upper:]' '[:lower:]' | sed 's/[^a-z0-9_]/_/g')"
            normalized_ext="$(printf '%s' "$ext" | tr '[:upper:]' '[:lower:]')"
            target="$dir/$normalized_base.$normalized_ext"

            if [[ "$file" != "$target" ]]; then
              if [[ -e "$target" ]]; then
                echo "::error file=$file::Rename collision: $target already exists"
                exit 1
              fi
              mv -- "$file" "$target"
              echo "Renamed: $name -> $(basename "$target")"
            fi
          done < <(find "$RES_DIR" -type f -print0)

      # Supply valid fallback launcher icons if the project has none.
      - name: Add missing launcher icons
        shell: bash
        run: |
          set -euo pipefail
          RES_DIR="app/src/main/res"
          ICON_DIR="$RES_DIR/mipmap-anydpi"
          mkdir -p "$ICON_DIR"

          for icon in ic_launcher ic_launcher_round; do
            if ! find "$RES_DIR" -type f \( -name "$icon.png" -o -name "$icon.webp" -o -name "$icon.xml" \) -print -quit | grep -q .; then
              cat > "$ICON_DIR/$icon.xml" <<'XML'
          <?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="48dp"
              android:height="48dp"
              android:viewportWidth="48"
              android:viewportHeight="48">
              <path
                  android:fillColor="#263B80"
                  android:pathData="M0,0h48v48h-48z" />
              <path
                  android:fillColor="#FFFFFF"
                  android:pathData="M12,12h24v6h-18v6h15v6h-15v6h18v6h-24z" />
          </vector>
          XML
              echo "Created fallback resource: $ICON_DIR/$icon.xml"
            fi
          done

      - name: Build debug APK
        run: gradle --no-daemon assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: FlinMobileLauncher-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
