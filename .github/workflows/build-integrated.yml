name: Build Flin Mobile integrated client

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Flin project
        uses: actions/checkout@v4
        with:
          path: flin

      - name: Checkout SA-MP client source
        uses: actions/checkout@v4
        with:
          repository: kuzia15/SAMP-Mobile
          ref: GTA-2.10
          path: client

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK and NDK
        uses: android-actions/setup-android@v4
        with:
          accept-android-sdk-licenses: true
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0 ndk;26.2.11394342'

      - name: Brand app and use CI signing
        working-directory: client
        shell: bash
        run: |
          set -euo pipefail
          sed -i 's#<string name="app_name">[^<]*</string>#<string name="app_name">Flin Mobile</string>#' app/src/main/res/values/strings.xml
          python3 - <<'PY'
          from pathlib import Path
          p = Path("app/build.gradle")
          s = p.read_text()
          start = s.find("    signingConfigs {")
          if start >= 0:
              end = s.find("\n    }\n    compileSdk", start)
              if end < 0:
                  raise SystemExit("Could not safely locate signingConfigs block")
              s = s[:start] + s[end + 7:]
          s = s.replace("            signingConfig signingConfigs.release\n", "")
          p.write_text(s)
          PY
          chmod +x gradlew

      - name: Build universal ARM32 + ARM64 APK
        working-directory: client
        run: ./gradlew --no-daemon assembleDebug

      - name: Upload integrated APK
        uses: actions/upload-artifact@v4
        with:
          name: Flin-Mobile-integrated-debug
          path: client/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
