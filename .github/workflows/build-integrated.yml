name: Build Flin Mobile integrated client

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: kuzia15/SAMP-Mobile
          ref: GTA-2.10
          path: client

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v4
        with:
          accept-android-sdk-licenses: true
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0 ndk;26.2.11394342'

      - name: Install Flin launcher screen
        working-directory: client
        shell: bash
        run: |
          set -euo pipefail
          cat > app/src/main/java/com/samp/mobile/launcher/LauncherActivity.java <<'JAVA'
          package com.samp.mobile.launcher;
          import android.app.*;
          import android.content.*;
          import android.graphics.*;
          import android.graphics.drawable.*;
          import android.net.Uri;
          import android.os.*;
          import android.provider.Settings;
          import android.view.*;
          import android.view.inputmethod.InputMethodManager;
          import android.widget.*;
          import com.samp.mobile.game.SAMP;
          import java.io.*;
          import java.nio.charset.StandardCharsets;

          public class LauncherActivity extends Activity {
            int orange=0xffff8126, pale=0xffffd1a4; EditText nick;
            GradientDrawable shape(int color,int stroke,int radius){
              GradientDrawable d=new GradientDrawable(); d.setColor(color); d.setCornerRadius(radius);
              if(stroke!=0)d.setStroke(dp(1),stroke); return d;
            }
            int dp(float v){return (int)(v*getResources().getDisplayMetrics().density+.5f);}
            TextView label(String s,int size,int color,boolean bold){
              TextView t=new TextView(this);t.setText(s);t.setTextSize(size);t.setTextColor(color);
              if(bold)t.setTypeface(Typeface.DEFAULT,Typeface.BOLD);return t;
            }
            LinearLayout column(){LinearLayout l=new LinearLayout(this);l.setOrientation(1);return l;}
            LinearLayout.LayoutParams lp(int w,int h){return new LinearLayout.LayoutParams(w<0?w:dp(w),h<0?h:dp(h));}
            TextView button(String s,boolean primary){
              TextView b=label(s,primary?19:14,Color.WHITE,true);b.setGravity(Gravity.CENTER);
              b.setPadding(dp(12),dp(8),dp(12),dp(8));
              b.setBackground(shape(primary?orange:0xdd120d0a,primary?0xffffbd75:0xff70452b,dp(13)));
              return b;
            }
            @Override public void onCreate(Bundle b){
              super.onCreate(b);setRequestedOrientation(0);
              getWindow().setStatusBarColor(Color.rgb(12,7,4));getWindow().setNavigationBarColor(Color.BLACK);
              FrameLayout root=new FrameLayout(this);
              GradientDrawable bg=new GradientDrawable(GradientDrawable.Orientation.TL_BR,
                new int[]{0xff160b06,0xff54200c,0xff120906,0xff050403});root.setBackground(bg);
              // ember-like decorative glow behind the launcher content
              View glow=new View(this);GradientDrawable gd=new GradientDrawable(GradientDrawable.Orientation.TOP_BOTTOM,
                new int[]{0x88ff6a18,0x22a52b08,0x00000000});glow.setBackground(gd);
              root.addView(glow,new FrameLayout.LayoutParams(-1,-1));
              View art=new View(this){
                Paint p=new Paint(3);
                @Override protected void onDraw(Canvas c){
                  super.onDraw(c);float w=getWidth(),h=getHeight();
                  p.setShader(new RadialGradient(w*.52f,h*.46f,w*.58f,new int[]{0x44ff6b20,0x1aff3c12,0x00000000},null,Shader.TileMode.CLAMP));
                  c.drawRect(0,0,w,h,p);p.setShader(null);p.setColor(0x18ff9a55);p.setStrokeWidth(dp(1));
                  for(int i=-4;i<12;i++){float x=i*w/8f;c.drawLine(x,h*.12f,x+w*.18f,h,p);}
                  p.setColor(0x22ff6b28);p.setStyle(Paint.Style.STROKE);p.setStrokeWidth(dp(2));
                  c.drawCircle(w*.51f,h*.47f,Math.min(w,h)*.24f,p);c.drawCircle(w*.51f,h*.47f,Math.min(w,h)*.31f,p);p.setStyle(Paint.Style.FILL);
                }
              };
              root.addView(art,new FrameLayout.LayoutParams(-1,-1));
              LinearLayout page=column();page.setPadding(dp(20),dp(12),dp(20),dp(10));
              root.addView(page,new FrameLayout.LayoutParams(-1,-1));
              LinearLayout top=new LinearLayout(this);top.setGravity(Gravity.CENTER_VERTICAL);
              TextView mark=label("F",22,Color.BLACK,true);mark.setGravity(Gravity.CENTER);
              mark.setBackground(shape(orange,0,dp(10)));top.addView(mark,lp(36,34));
              TextView brand=label("  FLIN MOBILE",18,Color.WHITE,true);top.addView(brand);
              top.addView(new View(this),new LinearLayout.LayoutParams(0,1,1));
              top.addView(label("● ONLINE     32 мс     v1.0",12,pale,true));page.addView(top,lp(-1,40));
              TextView title=label("FLIN",54,0xffffa45b,true);title.setGravity(Gravity.CENTER);title.setLetterSpacing(0.18f);title.setShadowLayer(dp(18),0,dp(3),0xffff5a12);TextView subtitle=label("ROLEPLAY  /  MOBILE EXPERIENCE",11,0xffd6a17b,true);subtitle.setGravity(Gravity.CENTER);subtitle.setLetterSpacing(0.22f);LinearLayout hero=column();hero.setGravity(Gravity.CENTER);hero.addView(title);hero.addView(subtitle,lp(-1,24));page.addView(hero,new LinearLayout.LayoutParams(-1,0,0.8f));
              title.setShadowLayer(dp(18),0,dp(3),0xffff5a12);
              LinearLayout content=new LinearLayout(this);content.setGravity(Gravity.CENTER_VERTICAL);
              page.addView(content,new LinearLayout.LayoutParams(-1,0,2.8f));
              LinearLayout left=column();left.setPadding(dp(4),0,dp(10),0);
              content.addView(left,new LinearLayout.LayoutParams(0,-1,1.05f));
              left.addView(label("ВЫБОР СЕРВЕРА",12,0xffffa66b,true),lp(-1,30));
              LinearLayout server=column();server.setPadding(dp(13),dp(10),dp(13),dp(10));
              server.setBackground(shape(0xee1a100c,0xffb95b2a,dp(18)));
              server.addView(label("Flin Mobile #1",16,Color.WHITE,true));
              server.addView(label("● ● ● ● ●",10,0xff7c5a42,false),lp(-1,20));
              ProgressBar online=new ProgressBar(this,null,android.R.attr.progressBarStyleHorizontal);
              online.setMax(100);online.setProgress(24);online.setProgressTintList(android.content.res.ColorStateList.valueOf(0xff43c978));
              online.setProgressBackgroundTintList(android.content.res.ColorStateList.valueOf(0xff60432f));
              server.addView(online,lp(-1,8));
              LinearLayout stats=new LinearLayout(this);stats.setPadding(0,dp(9),0,0);
              stats.addView(label("Ping 32 мс",12,0xffd8c5b5,false));
              stats.addView(new View(this),new LinearLayout.LayoutParams(0,1,1));
              stats.addView(label("Role Play",12,0xffffad66,true));server.addView(stats);
              server.addView(label("Игровой режим: RP",12,0xffb7a69a,false),lp(-1,22));
              left.addView(server,lp(-1,112));
              TextView second=label("Flin Mobile #2\nСкоро открытие",14,0xffc8b7aa,true);
              second.setPadding(dp(13),dp(10),dp(13),dp(8));second.setBackground(shape(0xbb21150f,0xff68452f,dp(14)));
              LinearLayout.LayoutParams sp=lp(-1,62);sp.topMargin=dp(9);left.addView(second,sp);
              LinearLayout right=column();right.setPadding(dp(10),0,dp(4),0);
              content.addView(right,new LinearLayout.LayoutParams(0,-1,1.0f));
              right.addView(label("ИГРОВОЙ ПРОФИЛЬ",12,0xffffa66b,true),lp(-1,30));
              nick=new EditText(this);nick.setSingleLine(true);nick.setTextSize(16);nick.setTextColor(Color.WHITE);
              nick.setHintTextColor(0xff9b8779);nick.setHint("Nick_Name");nick.setPadding(dp(14),0,dp(12),0);
              nick.setBackground(shape(0xdd21130c,0xff80502f,dp(13)));
              nick.setText(getPreferences(0).getString("nickname",""));
              right.addView(nick,lp(-1,52));
              TextView play=button("УСТАНОВИТЬ ИГРУ\nЗагрузить кэш и запустить Flin RP",true);
              play.setGravity(Gravity.CENTER);LinearLayout.LayoutParams pp=lp(-1,72);pp.topMargin=dp(12);right.addView(play,pp);
              play.setOnClickListener(v->startGame());
              LinearLayout actions=new LinearLayout(this);LinearLayout.LayoutParams ap=lp(-1,42);ap.topMargin=dp(9);right.addView(actions,ap);
              TextView settings=button("Настройки",false),discord=button("Discord",false);
              actions.addView(settings,new LinearLayout.LayoutParams(0,-1,1));actions.addView(discord,new LinearLayout.LayoutParams(0,-1,1));
              settings.setOnClickListener(v->new AlertDialog.Builder(this).setTitle("Настройки")
                .setMessage("Сервер: 195.18.27.226:3146\nВерсия клиента: Flin Mobile")
                .setPositiveButton("ОК",null).show());
              discord.setOnClickListener(v->{try{startActivity(new Intent(Intent.ACTION_VIEW,Uri.parse("https://discord.com/")));}catch(Exception e){}});
              TextView footer=label("BUILT FOR ROLEPLAY",11,0xffa97855,true);footer.setGravity(Gravity.CENTER);
              page.addView(footer,lp(-1,30));
              LinearLayout bottom=new LinearLayout(this);bottom.setOrientation(1);
              LinearLayout cap=new LinearLayout(this);cap.setGravity(Gravity.CENTER_VERTICAL);
              cap.addView(label("Загрузка кэша",12,Color.WHITE,true));
              cap.addView(new View(this),new LinearLayout.LayoutParams(0,1,1));
              cap.addView(label("Ожидание запуска  •  Flin RP",11,0xffd4c2b3,false));
              bottom.addView(cap,lp(-1,20));
              ProgressBar cache=new ProgressBar(this,null,android.R.attr.progressBarStyleHorizontal);
              cache.setMax(100);cache.setProgress(0);cache.setProgressTintList(android.content.res.ColorStateList.valueOf(orange));
              bottom.addView(cache,lp(-1,7));page.addView(bottom,lp(-1,28));
              setContentView(root);
            }
            void startGame(){
              if(Build.VERSION.SDK_INT>=30&&!Environment.isExternalStorageManager()){
                try{Intent i=new Intent(Settings.ACTION_MANAGE_APP_ALL_FILES_ACCESS_PERMISSION);i.setData(Uri.parse("package:"+getPackageName()));startActivity(i);}
                catch(Exception e){startActivity(new Intent(Settings.ACTION_MANAGE_ALL_FILES_ACCESS_PERMISSION));}
                Toast.makeText(this,"Разреши доступ к файлам для сохранения игрового кэша",Toast.LENGTH_LONG).show();return;
              }
              String n=nick.getText().toString().trim();
              if(!n.matches("[A-Za-z0-9_]{3,24}")){Toast.makeText(this,"Ник: 3–24 символа, латиница, цифры и _",Toast.LENGTH_LONG).show();return;}
              getPreferences(0).edit().putString("nickname",n).apply();
              try{
                File dir=new File(Environment.getExternalStorageDirectory(),"FlinMobile");
                if(!dir.exists()&&!dir.mkdirs())throw new Exception("Не удалось создать папку FlinMobile");
                String ini="[client]\nhost = 195.18.27.226\nport = 3146\nname = "+n+"\nautoaim = 0\n\n[debug]\ndebug = false\nonline = true\n";
                try(FileOutputStream out=new FileOutputStream(new File(dir,"settings.ini"))){out.write(ini.getBytes(StandardCharsets.UTF_8));}
                Intent setup=new Intent(this,SplashActivity.class); startActivity(setup); finish();
              }catch(Exception e){Toast.makeText(this,"Ошибка запуска: "+e.getMessage(),Toast.LENGTH_LONG).show();}
            }
          }
          JAVA
          # Keep downloaded GTA/SA-MP data in shared internal storage, not Android/data.
          python3 - <<'PY'
          from pathlib import Path
          p=Path("app/src/main/java/com/wardrumstudios/utils/WarMedia.java")
          s=p.read_text()
          import re
          pattern=r'                File externalFilesDir = getExternalFilesDir\(null\);.*?return externalFilesDir\.getAbsolutePath\(\) \+ "/";'
          replacement='''                File sharedGameDir = new File(Environment.getExternalStorageDirectory(), "FlinMobile");
                          if (!sharedGameDir.exists() && !sharedGameDir.mkdirs()) {
                              return "";
                          }
                          this.baseDirectoryRoot = Environment.getExternalStorageDirectory().getAbsolutePath();
                          return sharedGameDir.getAbsolutePath() + "/";'''
          s2,n=re.subn(pattern,lambda _: replacement,s,count=1,flags=re.S)
          if n != 1:
              raise SystemExit("Could not patch game data directory")
          p.write_text(s2)
          PY
          # Fix case-sensitive include mismatch in upstream native source.
          python3 - <<'PYFIX'
          from pathlib import Path
          p=Path("app/src/main/cpp/samp/gui/gui.h")
          s=p.read_text()
          s=s.replace("playerTabList.h", "playertablist.h")
          p.write_text(s)
          PYFIX
          # Fix upstream case mismatch: tracked header is rgba.h on Linux.
          sed -i 's/"RGBA.h"/"rgba.h"/' app/src/main/cpp/samp/game/rgba.cpp
          # Upstream directory is vendor/raknet (lowercase), not vendor/RakNet.
          find app/src/main/cpp/samp -type f \( -name '*.h' -o -name '*.cpp' \) -print0 | xargs -0 sed -i 's#../vendor/RakNet/#../vendor/raknet/#g'
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          ET.register_namespace("android", "http://schemas.android.com/apk/res/android")
          p=Path("app/src/main/AndroidManifest.xml")
          tree=ET.parse(p); root=tree.getroot()
          a="{http://schemas.android.com/apk/res/android}"
          app=root.find("application")
          for act in app.findall("activity"):
              name=act.get(a+"name","")
              if name=="com.samp.mobile.game.SAMP":
                  act.set(a+"exported","false")
                  for f in list(act.findall("intent-filter")): act.remove(f)
              elif name==".launcher.LauncherActivity":
                  act.set(a+"screenOrientation","landscape")
                  act.set(a+"exported","true")
              elif name in (".launcher.SplashActivity",".launcher.UpdateActivity",".launcher.MainActivity"):
                  act.set(a+"screenOrientation","landscape")
              if act.findall("intent-filter") and a+"exported" not in act.attrib:
                  act.set(a+"exported","true")
          if not any(x.get(a+"name") in (".launcher.LauncherActivity", "com.samp.mobile.launcher.LauncherActivity") for x in app.findall("activity")):
              act=ET.SubElement(app,"activity",{a+"name":".launcher.LauncherActivity",a+"screenOrientation":"sensor",a+"exported":"true"})
              f=ET.SubElement(act,"intent-filter")
              ET.SubElement(f,"action",{a+"name":"android.intent.action.MAIN"})
              ET.SubElement(f,"category",{a+"name":"android.intent.category.LAUNCHER"})
          tree.write(p,encoding="utf-8",xml_declaration=True)
          PY

      - name: Configure dependency repositories
        working-directory: client
        shell: bash
        run: |
          set -euo pipefail
          sed -i '/mint\.splunk\.com/d' build.gradle
          sed -i 's/com.github.amitshekhariitbhu:PRDownloader:1.0.1/com.github.amitshekhariitbhu:PRDownloader:1.0.2/' app/build.gradle
          python3 - <<'PYREPO'
          from pathlib import Path
          p=Path("app/build.gradle")
          s=p.read_text()
          marker="dependencies {"
          repo = "repositories { maven { url 'https://maven.scijava.org/content/repositories/public/' } }" + chr(10) + chr(10)
          if marker not in s:
              raise SystemExit("Could not find app dependencies block")
          s=s.replace(marker, repo+marker, 1)
          p.write_text(s)
          PYREPO

      - name: Brand and remove upstream signing keys
        working-directory: client
        shell: bash
        run: |
          set -euo pipefail
          sed -i 's#<string name="app_name">[^<]*</string>#<string name="app_name">Flin Mobile</string>#' app/src/main/res/values/strings.xml
          python3 - <<'PY'
          from pathlib import Path
          p=Path("app/build.gradle"); s=p.read_text()
          start=s.find("    signingConfigs {")
          if start>=0:
              end=s.find("\n    }\n    compileSdk",start)
              if end<0: raise SystemExit("Signing block layout changed")
              s=s[:start]+s[end+7:]
          s=s.replace("            signingConfig signingConfigs.release\n","")

          p.write_text(s)
          PY
          chmod +x gradlew

      - name: Build ARM32 and ARM64 APK
        working-directory: client
        run: ./gradlew --no-daemon assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: Flin-Mobile-integrated-debug
          path: client/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
